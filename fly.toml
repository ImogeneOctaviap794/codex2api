app = 'codex2api-fly'
primary_region = 'nrt'

[build]
  dockerfile = "Dockerfile"

[env]
  CODEX_PORT = "8080"
  TZ = "Asia/Shanghai"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[checks]
  [checks.health]
    type = "http"
    port = 8080
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "120s"

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
